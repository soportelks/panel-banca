<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/register" icon="chevron-back-outline" text=""></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="phone-code-content">
  <div class="phone-code-wrapper">
    <div class="phone-code-card">
      
      <!-- Logo RDAM -->
      <div class="brand-header">
        <div class="brand-logo-wrapper">
          <img
            src="assets/images/Logo_RDAM_negro.png"
            class="brand-logo"
            alt="Logo RDAM"
          />
        </div>
        <h1 class="brand-title">Código de Confirmación</h1>
        <p class="brand-subtitle">
          Ingresa el código que recibiste vía SMS, WhatsApp o correo electrónico para continuar tu alta.
        </p>
      </div>

      <!-- Grid de Dígitos -->
      <div class="digits-container">
        <ion-grid>
          <ion-row class="digits-row">
            <ion-col>
              <ion-input type="number" maxlength="1" class="digit-box" placeholder="•"></ion-input>
            </ion-col>
            <ion-col>
              <ion-input type="number" maxlength="1" class="digit-box" placeholder="•"></ion-input>
            </ion-col>
            <ion-col>
              <ion-input type="number" maxlength="1" class="digit-box" placeholder="•"></ion-input>
            </ion-col>
            <ion-col>
              <ion-input type="number" maxlength="1" class="digit-box" placeholder="•"></ion-input>
            </ion-col>
            <ion-col>
              <ion-input type="number" maxlength="1" class="digit-box" placeholder="•"></ion-input>
            </ion-col>
          </ion-row>

          <ion-row class="ion-justify-content-center ion-margin-top">
            <a (click)="setOpen(true)" class="resend-link">¿No recibiste el código?</a>
            <ion-alert
              [isOpen]="isAlertOpen"
              header="Código Reenviado"
              message="Te hemos enviado un nuevo código de confirmación a tus medios de contacto."
              [buttons]="alertButtons"
              (didDismiss)="setOpen(false)"
            ></ion-alert>
          </ion-row>
        </ion-grid>
      </div>

      <!-- Botón Continuar -->
      <div class="action-wrapper">
        <ion-button
          expand="block"
          size="large"
          class="btn-continue"
          routerLink="/datos-alta"
        >
          Continuar
        </ion-button>
      </div>

      <!-- Pie de Seguridad -->
      <div class="security-footer">
        <ion-icon name="shield-checkmark"></ion-icon>
        <span>Proceso seguro de validación telefónica</span>
      </div>

    </div>
  </div>
</ion-content>
