<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="ion-text-center" style="margin-bottom: 20px">
    <ion-icon
      name="person-circle-outline"
      style="font-size: 150px; color: gray; border-radius: 10px"
    ></ion-icon>
  </div>

  <ion-list>
    <ion-item>
      <ion-icon name="wallet-outline" slot="start"></ion-icon>
      <ion-input
        [(ngModel)]="datosCliente.clave_cliente"
        label="Clave Cliente"
        labelPlacement="floating"
        required
        [readonly]="true"
      ></ion-input>
      <ion-icon
        name="copy-outline"
        slot="end"
        (click)="copiarTexto(datosCliente.clave_cliente)"
      >
      </ion-icon>
    </ion-item>
    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-input
        [(ngModel)]="datosCliente.nombre_prospecto"
        label="Nombre"
        labelPlacement="floating"
        [readonly]="true"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-input
        [(ngModel)]="datosCliente.correo_electronico"
        label="Correo Electrónico"
        labelPlacement="floating"
        type="email"
        [readonly]="true"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="call-outline" slot="start"></ion-icon>
      <ion-input
        [(ngModel)]="datosCliente.numero_telefono"
        label="Número de Teléfono"
        labelPlacement="floating"
        type="tel"
        minlength="10"
        maxlength="10"
        required
        [readonly]="true"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="wallet-outline" slot="start"></ion-icon>
      <ion-input
        [(ngModel)]="datosCliente.clabe"
        label="Clabe"
        labelPlacement="floating"
        type="tel"
        minlength="18"
        maxlength="18"
        required
        [readonly]="true"
      ></ion-input>
      <!-- Icono para copiar -->
      <ion-icon
        name="copy-outline"
        slot="end"
        (click)="copiarTexto(datosCliente.clabe)"
      >
      </ion-icon>
    </ion-item>
  </ion-list>

  <div class="ion-text-center" style="margin-top: 20px">
    <ion-button color="danger" (click)="abrirModalCambioContrasena()"
      >Cambiar Contraseña</ion-button
    >
  </div>
</ion-content>

<ion-modal #modal [isOpen]="isModalOpen">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Cambiar Contraseña</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrarModal()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-list>
        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            [(ngModel)]="contrasenaActual"
            [type]="mostrarContrasenaActual ? 'text' : 'password'"
            label="Contraseña Actual"
            labelPlacement="floating"
            required
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="mostrarContrasenaActual ? 'eye' : 'eye-off'"
            (click)="mostrarContrasenaActual = !mostrarContrasenaActual"
          >
          </ion-icon>
        </ion-item>

        <ion-item>
          <ion-icon name="key-outline" slot="start"></ion-icon>
          <ion-input
            [(ngModel)]="nuevaContrasena"
            [type]="mostrarNuevaContrasena ? 'text' : 'password'"
            label="Nueva Contraseña"
            labelPlacement="floating"
            (ngModelChange)="validarContrasena(nuevaContrasena)"
            required
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="mostrarNuevaContrasena ? 'eye' : 'eye-off'"
            (click)="mostrarNuevaContrasena = !mostrarNuevaContrasena"
          >
          </ion-icon>
        </ion-item>
        <p
          *ngIf="mensajeValidacionContrasena"
          style="color: red; font-size: 14px"
        >
          {{ mensajeValidacionContrasena }}
        </p>

        <ion-item>
          <ion-icon name="key-outline" slot="start"></ion-icon>
          <ion-input
            [(ngModel)]="confirmarContrasena"
            [type]="mostrarConfirmarContrasena ? 'text' : 'password'"
            label="Confirmar Contraseña"
            labelPlacement="floating"
            required
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="mostrarConfirmarContrasena ? 'eye' : 'eye-off'"
            (click)="mostrarConfirmarContrasena = !mostrarConfirmarContrasena"
          >
          </ion-icon>
        </ion-item>
      </ion-list>
      <div class="ion-text-center" style="margin-top: 20px">
        <ion-button
          expand="block"
          (click)="cambiarContrasena()"
          [disabled]="!isCambioContrasenaHabilitado"
        >
          Confirmar Cambio
        </ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
