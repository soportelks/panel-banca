events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redirección de HTTP a HTTPS
    server {
        listen 80;
        server_name lksbaas.com.mx www.lksbaas.com.mx;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name lksbaas.com.mx www.lksbaas.com.mx;

        root /usr/share/nginx/html;
        index index.html;

        # Configurar certificados SSL
        ssl_certificate /etc/nginx/ssl/certificado.crt;
        ssl_certificate_key /etc/nginx/ssl/clave.key;

        # Seguridad en SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Configurar SPA (Single Page Application)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Caché para archivos estáticos
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public, max-age=15552000, immutable";
        }

        # Seguridad: Bloquear archivos ocultos
        location ~ /\. {
            deny all;
        }
    }
}
